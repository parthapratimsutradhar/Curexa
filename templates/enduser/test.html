<button id="pay-btn">Pay</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.getElementById('pay-btn').onclick = async function() {
    const res = await fetch('/test-razorpay/');
    const data = await res.json();

    if (data.success) {
        const options = {
            "key": data.data.razorpay_key,
            "amount": data.data.amount,
            "currency": data.data.currency,
            "name": "College Project",
            "description": "Invoice Payment",
            "order_id": data.data.razorpay_order_id,
            "handler": function(response){
                alert("Payment Success! Razorpay ID: " + response.razorpay_payment_id);
            },
            "prefill": {
                "name": "Test User",
                "email": "test@example.com",
                "contact": "9999999999"
            },
            "theme": { "color": "#3399cc" }
        };
        const rzp = new Razorpay(options);
        rzp.open();
    } else {
        alert("Error: " + data.error);
    }
}
</script>
