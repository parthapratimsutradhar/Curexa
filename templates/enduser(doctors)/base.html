<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MedSchedule{% endblock %}</title>
  <link rel="icon" href="https://res.cloudinary.com/dcfkxity4/image/upload/v1773339555/favicon_o9mggb.ico" type="image/x-icon">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* Paste the full CSS from the original file here */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #f5fafc;
      height: 100vh;
      display: flex;
    }
    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 260px;
      background: white;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 2rem 1.2rem;
      border-right: 2px solid #def0ec;
      box-shadow: 4px 0 20px -12px #86c7c0;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #117b82;
      padding-left: 0.5rem;
    }
    .logo-area i {
      font-size: 2.2rem;
      color: #279b9b;
    }
    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      border-radius: 18px;
      text-decoration: none; 
      color: #196e76;
      font-weight: 500;
      transition: 0.2s;
      cursor: pointer;
    }
    .nav-item i {
      width: 24px;
      font-size: 1.3rem;
      color: #319ba0;
    }
    .nav-item.active {
      background: #daf4f2;
      border-left: 4px solid #1aa39a;
      padding-left: calc(1.2rem - 4px);
      color: #0c5f63;
      font-weight: 600;
      box-shadow: 0 6px 12px -8px #167e7e;
    }
    .nav-item:not(.active):hover {
      background: #ecfbf9;
      transform: translateX(4px);
    }
    /* ---------- MAIN CONTENT ---------- */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.8rem 2rem 2rem;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #115e67;
      letter-spacing: -0.5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1.8rem;
    }
    .notification {
      font-size: 1.6rem;
      color: #257c83;
      position: relative;
    }
    .avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, #87cfca, #5cb8b2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      border: 2px solid white;
      box-shadow: 0 4px 10px #a1d7d2;
    }
    .doctor-name {
  font-size: 1rem;
  font-weight: 500;
  color: #115e67;
  margin-left: 0.5rem;
}
    .doctor-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 0.4rem 1rem 0.4rem 0.8rem;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      text-decoration: none;
      cursor: pointer;
    }

    .doctor-profile i {
      font-size: 2rem;
      color: #116466;
    }

    .doctor-profile span {
      font-weight: 600;
      color: #173e5c;
    }
    /* toggle pills */
    .toggle-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.2rem;
      background: white;
      padding: 0.5rem;
      border-radius: 60px;
      width: fit-content;
      box-shadow: 0 8px 18px -10px #95cfc8;
    }
    .toggle-btn {
      padding: 0.8rem 2rem;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      background: transparent;
      color: #236c74;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-btn.active {
      background: #daf4f0;
      color: #0b5757;
      box-shadow: 0 4px 8px -4px #3fa09b;
    }
    /* cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .appointment-card {
      background: white;
      border-radius: 28px;
      padding: 1.4rem 1.5rem;
      box-shadow: 0 16px 28px -14px #1a8a8a30;
      transition: 0.2s;
      border: 1px solid #e7f7f0;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    .appointment-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 36px -16px #1f8a8a60;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .apt-id {
      font-weight: 700;
      color: #18838b;
      background: #def7f0;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
    }
    .patient-name {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 1.2rem;
      color: #0b5b63;
    }
    .patient-name i {
      color: #2ea09b;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .patient-name i:hover {
      transform: scale(1.15);
      color: #136f6b;
    }
    .card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin: 0.3rem 0;
    }
    .detail-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #2e7881;
      font-size: 0.95rem;
    }
    .detail-item i {
      width: 18px;
      color: #359f9b;
    }
    .type-badge {
      background: #d5f0f0;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1c6f70;
    }
    .status-badge {
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-upcoming {
      background: #daf5e9;
      color: #067358;
    }
    .status-completed {
      background: #cce5ff;
      color: #025091;
    }
    .status-cancelled {
      background: #ffe3d6;
      color: #b13e2d;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
      margin-top: 0.5rem;
      border-top: 1px dashed #b7e2da;
      padding-top: 0.9rem;
    }
    .btn-icon {
      background: transparent;
      border: 1px solid #b7e2da;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      color: #1d7a7a;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
    }
    .btn-icon i {
      font-size: 0.9rem;
    }
    .btn-icon:hover {
      background: #dcf7f0;
      border-color: #4faca5;
    }
    /* MODALS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(20, 80, 80, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      border-radius: 40px;
      padding: 2rem 2.2rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 50px #12505050;
    }
    .modal h2 {
      font-size: 1.8rem;
      color: #0b5d5d;
      margin-bottom: 1.5rem;
      border-left: 6px solid #42b3ab;
      padding-left: 1rem;
    }
    .modal-field {
      margin-bottom: 1.2rem;
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }
    .modal-field i {
      width: 28px;
      color: #319b97;
      font-size: 1.2rem;
      margin-top: 0.2rem;
    }
    .field-label {
      font-weight: 600;
      color: #1d5f68;
      min-width: 110px;
    }
    .field-value {
      color: #144f57;
    }
    .patient-photo {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .patient-photo i {
      font-size: 5rem;
      color: #2e8f8b;
      background: #daf1ed;
      padding: 1rem;
      border-radius: 50%;
    }
    .close-modal {
      background: #e2f3ef;
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 40px;
      font-weight: 600;
      color: #136a6a;
      cursor: pointer;
      margin-top: 1.2rem;
      width: 100%;
      font-size: 1rem;
    }
    /* responsive */
    @media (max-width: 800px) {
      .sidebar {
        width: 80px;
        padding: 1rem 0.5rem;
      }
      .sidebar .logo-area span, .nav-item span {
        display: none;
      }
      .nav-item i {
        font-size: 1.8rem;
      }
      .main-content {
        padding: 1.5rem;
      }
    }
    @media (max-width: 550px) {
      .toggle-container {
        width: 100%;
        justify-content: center;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .modal {
        padding: 1.5rem;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- SIDEBAR (included or directly placed) -->
<aside class="sidebar">
  <div class="logo-area">
    <i class="fas fa-stethoscope"></i>
    <span>Curexa</span>
  </div>

  <nav class="nav-menu">
    
    <a href="{% url 'doctor_appointment_management' %}" 
       class="nav-item">
      <i class="fas fa-calendar-check"></i> 
      <span>Appointments</span>
    </a>

    <a href="{% url 'doctor_availability_management' %}" 
       class="nav-item">
      <i class="fas fa-clock"></i> 
      <span>Availability</span>
    </a>

    <a href="{% url 'doctor_earning' %}" 
       class="nav-item ">
      <i class="fas fa-indian-rupee-sign"></i> 
      <span>Earnings</span>
    </a>

  </nav>
</aside>

  <!-- MAIN CONTENT BLOCK -->
  <main class="main-content">
    <!-- header -->
    <div class="header">
      <h1>{% block page_title %}Appointments{% endblock %}</h1>
      <div class="header-right">
        <i class="fas fa-bell notification"></i>
        <a href="{% url 'doctor_profile' %}" class="doctor-profile">
          <i class="fas fa-user-circle"></i>
          <span>Dr. Sarah Chen</span>
        </a>
      </div>
    </div>

    {% block content %}
    <!-- Page-specific content goes here -->
    {% endblock %}
  </main>




  <script>
    // Basic modal close functionality (can be moved to a separate JS file)
    (function() {
      const appointmentModal = document.getElementById('appointmentModal');
      const patientModal = document.getElementById('patientModal');
      const closeApptModal = document.getElementById('closeApptModal');
      const closePatientModal = document.getElementById('closePatientModal');

      if (closeApptModal) {
        closeApptModal.addEventListener('click', () => {
          if (appointmentModal) appointmentModal.style.display = 'none';
        });
      }
      if (closePatientModal) {
        closePatientModal.addEventListener('click', () => {
          if (patientModal) patientModal.style.display = 'none';
        });
      }
      window.addEventListener('click', (e) => {
        if (e.target === appointmentModal) appointmentModal.style.display = 'none';
        if (e.target === patientModal) patientModal.style.display = 'none';
      });
    })();

    
  </script>

  <script>
  (function() {
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-item').forEach(link => {
      link.classList.remove('active');
      const href = link.getAttribute('href');
      // Compare the full path or use a more specific rule if needed
      if (href === currentPath) {
        link.classList.add('active');
      }
    });
  })();
</script>
</body>
</html>
