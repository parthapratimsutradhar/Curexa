{% extends 'enduser(doctors)/base.html' %}
{% load static %}
{% block title %}Appointments | MedSchedule{% endblock %}

{% block page_title %}Appointments{% endblock %}

{% block content %}  
  <div class="toggle-container">
    <button class="toggle-btn active" id="btnUpcoming">Upcoming Appointments</button>
    <button class="toggle-btn" id="btnHistory">Appointment History</button>
  </div>

  <!-- cards container -->
  <div id="cardsContainer" class="cards-grid"></div>
  <div id="noDataMsg" style="display: none; text-align: center; color: #3f8f8f; padding: 3rem;">No appointments found.</div>
  
  <!-- Appointment Details Modal -->
  <div class="modal-overlay" id="appointmentModal">
    <div class="modal">
      <h2><i class="fas fa-calendar-alt" style="margin-right: 10px;"></i>Appointment Details</h2>
      <div id="appointmentModalContent"></div>
      <button class="close-modal" id="closeApptModal">Close</button>
    </div>
  </div>

  <!-- Patient Details Modal -->
  <div class="modal-overlay" id="patientModal">
    <div class="modal">
      <h2><i class="fas fa-user-injured"></i> Patient Profile</h2>
      <div id="patientModalContent"></div>
      <button class="close-modal" id="closePatientModal">Close</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- DUMMY DATA ----------
      const upcomingAppointments = [
        {
          aptId: 'APT-101',
          patientName: 'Ravi Shukla',
          patientAge: 54,
          patientGender: 'Male',
          patientPhone: '+91 98765 4321',
          patientEmail: 'ravi.s@example.com',
          patientAddress: '12 Lake View, Bangalore',
          medicalHistory: 'Hypertension, Type 2 Diabetes',
          date: '2025-04-05',
          time: '10:30 AM',
          type: 'Clinic',
          status: 'Confirmed',
          reason: 'Chest pain, shortness of breath',
          notes: 'ECG suggested; bring previous reports.',
          paymentStatus: 'Pending'
        },
        {
          aptId: 'APT-102',
          patientName: 'Anita Desai',
          patientAge: 42,
          patientGender: 'Female',
          patientPhone: '+91 99887 6655',
          patientEmail: 'anita.d@example.com',
          patientAddress: '45 Green Park, Delhi',
          medicalHistory: 'Asthma',
          date: '2025-04-05',
          time: '02:15 PM',
          type: 'Online',
          status: 'Confirmed',
          reason: 'Follow-up, breathing difficulty',
          notes: 'Video call link will be sent.',
          paymentStatus: 'Paid'
        },
        {
          aptId: 'APT-103',
          patientName: 'John Mathew',
          patientAge: 35,
          patientGender: 'Male',
          patientPhone: '+91 77665 4433',
          patientEmail: 'john.m@example.com',
          patientAddress: '22 MG Road, Chennai',
          medicalHistory: 'Healthy',
          date: '2025-04-06',
          time: '09:45 AM',
          type: 'Clinic',
          status: 'Confirmed',
          reason: 'Annual checkup',
          notes: 'Fasting required.',
          paymentStatus: 'Pending'
        }
      ];

      const historyAppointments = [
        {
          aptId: 'APT-089',
          patientName: 'Kavya Nair',
          patientAge: 29,
          patientGender: 'Female',
          patientPhone: '+91 77665544',
          patientEmail: 'kavya.n@example.com',
          patientAddress: '7/2 East Street, Kochi',
          medicalHistory: 'Migraine',
          date: '2025-03-28',
          time: '11:00 AM',
          type: 'Clinic',
          status: 'Completed',
          reason: 'Severe headache',
          notes: 'Prescribed sumatriptan',
          paymentStatus: 'Paid',
          paymentAmount: '₹1500'
        },
        {
          aptId: 'APT-092',
          patientName: 'Imran Khan',
          patientAge: 48,
          patientGender: 'Male',
          patientPhone: '+91 88776655',
          patientEmail: 'imran.k@example.com',
          patientAddress: '33 Jubilee Hills, Hyderabad',
          medicalHistory: 'Heart condition',
          date: '2025-03-25',
          time: '03:30 PM',
          type: 'Online',
          status: 'Cancelled',
          reason: 'Fever, cough',
          notes: 'Cancelled by patient',
          paymentStatus: 'Refunded',
          paymentAmount: '₹2000'
        },
        {
          aptId: 'APT-095',
          patientName: 'Sunita Reddy',
          patientAge: 51,
          patientGender: 'Female',
          patientPhone: '+91 99887766',
          patientEmail: 'sunita.r@example.com',
          patientAddress: '88 Banjara Hills, Hyderabad',
          medicalHistory: 'Arthritis',
          date: '2025-03-22',
          time: '09:00 AM',
          type: 'Clinic',
          status: 'Completed',
          reason: 'Joint pain',
          notes: 'X-ray done',
          paymentStatus: 'Paid',
          paymentAmount: '₹1200'
        }
      ];

      // current displayed data
      let currentAppointments = upcomingAppointments; // default
      let currentView = 'upcoming'; // 'upcoming' or 'history'

      // DOM elements
      const cardsContainer = document.getElementById('cardsContainer');
      const noDataMsg = document.getElementById('noDataMsg');
      const btnUpcoming = document.getElementById('btnUpcoming');
      const btnHistory = document.getElementById('btnHistory');
      const appointmentModal = document.getElementById('appointmentModal');
      const patientModal = document.getElementById('patientModal');
      const appointmentModalContent = document.getElementById('appointmentModalContent');
      const patientModalContent = document.getElementById('patientModalContent');
      const closeApptModal = document.getElementById('closeApptModal');
      const closePatientModal = document.getElementById('closePatientModal');

      // Helper: render cards based on currentAppointments and view
      function renderCards() {
        if (!currentAppointments.length) {
          cardsContainer.innerHTML = '';
          noDataMsg.style.display = 'block';
          return;
        }
        noDataMsg.style.display = 'none';

        let html = '';
        currentAppointments.forEach((apt, index) => {
          // determine status class for upcoming/history
          let statusClass = '';
          if (currentView === 'upcoming') {
            statusClass = 'status-upcoming'; // confirmed
          } else {
            statusClass = apt.status === 'Completed' ? 'status-completed' : 'status-cancelled';
          }

          // for upcoming status text we keep original status (Confirmed) but can also show as "Confirmed"
          const statusText = currentView === 'upcoming' ? apt.status : apt.status;

          html += `
            <div class="appointment-card" data-index="${index}">
              <div class="card-header">
                <span class="apt-id"><i class="fas fa-hashtag"></i> ${apt.aptId}</span>
                <span class="type-badge"><i class="fas fa-${apt.type === 'Online' ? 'video' : 'hospital'}"></i> ${apt.type}</span>
              </div>
              <div class="patient-name">
                <i class="fas fa-user-circle"></i> ${apt.patientName}
                <i class="fas fa-eye view-patient" data-index="${index}" style="margin-left: auto;" title="View patient details"></i>
              </div>
              <div class="card-details">
                <span class="detail-item"><i class="fas fa-calendar"></i> ${apt.date}</span>
                <span class="detail-item"><i class="fas fa-clock"></i> ${apt.time}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="status-badge ${statusClass}">${statusText}</span>
                ${currentView === 'history' ? `<span class="detail-item"><i class="fas fa-rupee-sign"></i> ${apt.paymentAmount || 'N/A'}</span>` : ''}
              </div>
              <div class="card-actions">
                <a href="{% url 'doctor_prescription' %}" class="btn-icon prescribe-btn" data-index="${index}"><i class="fas fa-prescription"></i> Write Prescription</a>
                <button class="btn-icon view-details" data-index="${index}"><i class="fas fa-info-circle"></i> Details</button>
              </div>
            </div>
          `;
        });
        cardsContainer.innerHTML = html;

        // attach event listeners to eye icons and details buttons
        document.querySelectorAll('.view-patient').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = btn.dataset.index;
            openPatientModal(currentAppointments[index]);
          });
        });

        document.querySelectorAll('.view-details').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = btn.dataset.index;
            openAppointmentModal(currentAppointments[index]);
          });
        });

        // attach event listeners to the new Prescribed buttons
        document.querySelectorAll('.prescribe-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            window.location.href = btn.getAttribute('href') || "{% url 'doctor_prescription' %}";
            return;
            const index = btn.dataset.index;
            const apt = currentAppointments[index];
            alert(`Prescription for ${apt.patientName} (${apt.aptId}) – coming soon.`);
          });
        });
      }

      // open appointment modal
      function openAppointmentModal(apt) {
        const content = `
          <div class="modal-field"><i class="fas fa-id-card"></i><span class="field-label">Appointment ID:</span><span class="field-value">${apt.aptId}</span></div>
          <div class="modal-field"><i class="fas fa-user"></i><span class="field-label">Patient:</span><span class="field-value">${apt.patientName}</span></div>
          <div class="modal-field"><i class="fas fa-calendar"></i><span class="field-label">Date:</span><span class="field-value">${apt.date}</span></div>
          <div class="modal-field"><i class="fas fa-clock"></i><span class="field-label">Time:</span><span class="field-value">${apt.time}</span></div>
          <div class="modal-field"><i class="fas fa-stethoscope"></i><span class="field-label">Type:</span><span class="field-value">${apt.type}</span></div>
          <div class="modal-field"><i class="fas fa-notes-medical"></i><span class="field-label">Reason:</span><span class="field-value">${apt.reason || 'N/A'}</span></div>
          <div class="modal-field"><i class="fas fa-comment"></i><span class="field-label">Notes:</span><span class="field-value">${apt.notes || 'N/A'}</span></div>
          <div class="modal-field"><i class="fas fa-credit-card"></i><span class="field-label">Payment status:</span><span class="field-value">${apt.paymentStatus}</span></div>
          ${apt.paymentAmount ? `<div class="modal-field"><i class="fas fa-rupee-sign"></i><span class="field-label">Amount:</span><span class="field-value">${apt.paymentAmount}</span></div>` : ''}
          <div class="modal-field"><i class="fas fa-venus-mars"></i><span class="field-label">Age/Gender:</span><span class="field-value">${apt.patientAge} yrs, ${apt.patientGender}</span></div>
          <div class="modal-field"><i class="fas fa-phone-alt"></i><span class="field-label">Contact:</span><span class="field-value">${apt.patientPhone}</span></div>
        `;
        appointmentModalContent.innerHTML = content;
        appointmentModal.style.display = 'flex';
      }

      function openPatientModal(apt) {
        const content = `
          <div class="patient-photo"><i class="fas fa-user-circle"></i></div>
          <div class="modal-field"><i class="fas fa-user"></i><span class="field-label">Name:</span><span class="field-value">${apt.patientName}</span></div>
          <div class="modal-field"><i class="fas fa-calendar-alt"></i><span class="field-label">Age:</span><span class="field-value">${apt.patientAge}</span></div>
          <div class="modal-field"><i class="fas fa-venus-mars"></i><span class="field-label">Gender:</span><span class="field-value">${apt.patientGender}</span></div>
          <div class="modal-field"><i class="fas fa-phone-alt"></i><span class="field-label">Phone:</span><span class="field-value">${apt.patientPhone}</span></div>
          <div class="modal-field"><i class="fas fa-envelope"></i><span class="field-label">Email:</span><span class="field-value">${apt.patientEmail || 'N/A'}</span></div>
          <div class="modal-field"><i class="fas fa-map-marker-alt"></i><span class="field-label">Address:</span><span class="field-value">${apt.patientAddress || 'N/A'}</span></div>
          <div class="modal-field"><i class="fas fa-notes-medical"></i><span class="field-label">Medical history:</span><span class="field-value">${apt.medicalHistory || 'N/A'}</span></div>
        `;
        patientModalContent.innerHTML = content;
        patientModal.style.display = 'flex';
      }

      // toggle functions
      function showUpcoming() {
        btnUpcoming.classList.add('active');
        btnHistory.classList.remove('active');
        currentAppointments = upcomingAppointments;
        currentView = 'upcoming';
        renderCards();
      }

      function showHistory() {
        btnHistory.classList.add('active');
        btnUpcoming.classList.remove('active');
        currentAppointments = historyAppointments;
        currentView = 'history';
        renderCards();
      }

      // event listeners for toggle
      btnUpcoming.addEventListener('click', showUpcoming);
      btnHistory.addEventListener('click', showHistory);

      // close modals
      closeApptModal.addEventListener('click', () => appointmentModal.style.display = 'none');
      closePatientModal.addEventListener('click', () => patientModal.style.display = 'none');
      window.addEventListener('click', (e) => {
        if (e.target === appointmentModal) appointmentModal.style.display = 'none';
        if (e.target === patientModal) patientModal.style.display = 'none';
      });

      // initial render
      renderCards();
    })();
  </script>
  
{% endblock %}
