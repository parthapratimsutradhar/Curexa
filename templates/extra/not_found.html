<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 • page not found • Curexa</title>
  <style>
    /* ===== RESET & MEDICAL VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --depth-bg: #0a1a2b;        /* deep medical blue */
      --glow-primary: #2aa9ff;     /* clinical cyan */
      --glow-secondary: #6fcf97;   /* pharmacy green */
      --card-bg: rgba(18, 30, 45, 0.75);
      --text-light: #f0f9ff;
      --text-muted: #b8d4e7;
      --accent: #2d9cdb;
      --accent-glow: #1f7ab0;
      --border-glow: rgba(42, 169, 255, 0.3);
      --font-sans: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--depth-bg);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
      perspective: 1200px;
    }

    /* ===== ANIMATED BACKGROUND – PILLS & CROSSES ===== */
    .medical-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, rgba(42, 169, 255, 0.1) 70%);
      border-radius: 50%;
      filter: blur(50px);
      animation: floatShape 20s infinite alternate ease-in-out;
    }

    /* abstract pill-like forms */
    .shape-1 {
      width: 55vmax;
      height: 45vmax;
      top: -15vmax;
      left: -25vmax;
      background: radial-gradient(circle, rgba(42, 169, 255, 0.2), rgba(111, 207, 151, 0.15));
      animation-duration: 27s;
    }

    .shape-2 {
      width: 35vmin;
      height: 35vmin;
      bottom: 8vh;
      right: 10vw;
      background: radial-gradient(circle, rgba(111, 207, 151, 0.25), rgba(42, 169, 255, 0.1));
      filter: blur(70px);
      animation: floatShape 19s reverse infinite;
    }

    .shape-3 {
      width: 65vmin;
      height: 65vmin;
      top: 15vh;
      right: 5vw;
      background: radial-gradient(circle at 70% 20%, rgba(155, 204, 255, 0.25), transparent 70%);
      animation: floatShape 32s infinite;
    }

    .shape-4 {
      width: 30vmax;
      height: 30vmax;
      bottom: -5vmax;
      left: 5vmax;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.15), transparent 80%);
      filter: blur(60px);
      animation: floatShape 24s alternate-reverse infinite;
    }

    @keyframes floatShape {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 6%) scale(1.2); }
    }

    /* ===== MAIN CARD – FROSTED + 3D TILT ===== */
    .card-3d-wrapper {
      width: 100%;
      max-width: 680px;
      z-index: 10;
      transition: transform 0.2s ease-out;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px) saturate(200%);
      -webkit-backdrop-filter: blur(14px) saturate(200%);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.7),
                  0 0 0 1px rgba(42, 169, 255, 0.2) inset,
                  0 0 40px rgba(42, 169, 255, 0.3);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 40px 70px -15px black, 0 0 0 2px rgba(42, 169, 255, 0.4) inset, 0 0 70px var(--glow-primary);
    }

    /* ===== 404 MEDICAL GRADIENT ===== */
    .error-glow {
      font-size: clamp(7rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.2rem;
      background: linear-gradient(135deg, #6fcf97, #2aa9ff, #bb8af0, #6fcf97);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 6s ease infinite, floatText 4s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(42,169,255,0.7));
      letter-spacing: -5px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatText {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
      100% { transform: translateY(0px) scale(1); }
    }

    /* ===== MEDICAL TYPOGRAPHY ===== */
    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      margin: 0.5rem 0 0.8rem;
      background: linear-gradient(to right, #fff, #c9e2ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }

    .message {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
      font-weight: 300;
      backdrop-filter: blur(2px);
    }

    /* ===== PHARMACY BUTTON ===== */
    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(145deg, #1f3a4b, #11212e);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.25rem;
      padding: 0.9rem 2.5rem;
      border-radius: 60px;
      border: 1px solid rgba(42, 169, 255, 0.3);
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.6), 0 0 15px rgba(42, 169, 255, 0.2);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .home-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s ease;
    }

    .home-button:hover {
      background: linear-gradient(145deg, #2a4a60, #1a2f3f);
      border-color: #2aa9ff;
      box-shadow: 0 15px 30px -5px #2aa9ff66, 0 0 30px #2aa9ff;
      transform: scale(1.05);
    }

    .home-button:hover::before {
      left: 100%;
    }

    .home-button:active {
      transform: scale(0.98);
    }

    /* pill icon (instead of orbit) */
    .pill-icon {
      display: inline-block;
      width: 32px;
      height: 16px;
      background: linear-gradient(90deg, #6fcf97 0%, #6fcf97 45%, #2aa9ff 55%, #2aa9ff 100%);
      border-radius: 40px;
      box-shadow: 0 0 10px #6fcf97, 0 0 15px #2aa9ff;
      animation: softGlow 2s infinite alternate;
    }

    @keyframes softGlow {
      from { box-shadow: 0 0 5px #6fcf97, 0 0 10px #2aa9ff; }
      to { box-shadow: 0 0 15px #6fcf97, 0 0 25px #2aa9ff; }
    }

    /* pulse ring for button (medical cross variation) */
    .home-button::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 60px;
      padding: 2px;
      background: linear-gradient(135deg, #2aa9ff, #6fcf97);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .home-button:hover::after {
      opacity: 1;
    }

    /* ===== MICRO-INTERACTIONS ===== */
    .glow-pulse {
      animation: softPulse 3s infinite;
    }

    @keyframes softPulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      .card { padding: 2rem 1.5rem; }
      h1 { font-size: 2rem; }
      .error-glow { font-size: 6rem; letter-spacing: -2px; }
      .home-button { padding: 0.8rem 1.8rem; font-size: 1rem; }
      .pill-icon { width: 28px; height: 14px; }
    }
  </style>
</head>
<body>
  <!-- floating medical background (pills / crosses abstract) -->
  <div class="medical-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <!-- 3D tilt container -->
  <div class="card-3d-wrapper" id="tiltCard">
    <main class="card">
      <!-- big animated 404 -->
      <div class="error-glow" aria-label="404">404</div>

      <h1>prescription not found</h1>
      <p class="message">
        The page you're looking for is unavailable — maybe it was moved or never existed.<br>
        <span style="display: inline-block; margin-top: 12px; font-size: 1rem; opacity: 0.9; background: rgba(42,169,255,0.1); padding: 0.3rem 1rem; border-radius: 40px;">🩺 let’s get you back to your health dashboard</span>
      </p>

      <!-- interactive home button with pill icon -->
      <a href="/" class="home-button">
        <span class="pill-icon"></span>
        <span>return to pharmacy</span>
      </a>

      <!-- subtle footer with medical emojis -->
      <div style="margin-top: 2.5rem; font-size: 0.9rem; color: #6f96b5; display: flex; justify-content: center; gap: 2rem;">
        <span style="cursor: default; animation: softPulse 2s infinite;">💊</span>
        <span style="cursor: default;">• pharmacy online •</span>
        <span style="cursor: default; animation: softPulse 2s infinite reverse;">🩺</span>
      </div>
    </main>
  </div>

  <script>
    (function() {
      // ===== 3D TILT EFFECT (INTERACTIVE) =====
      const tiltContainer = document.getElementById('tiltCard');
      let isHovering = false;
      let requestFrame = null;
      
      const maxRotate = 8;      // max rotation in degrees
      const maxTranslate = 6;   // max shift in px
      
      if (tiltContainer) {
        const handleMouseMove = (e) => {
          if (!isHovering) return;
          
          const rect = tiltContainer.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          
          const percentX = (e.clientX - centerX) / (rect.width / 2);
          const percentY = (e.clientY - centerY) / (rect.height / 2);
          
          const rotateY = maxRotate * percentX;
          const rotateX = -maxRotate * percentY;
          const translateX = maxTranslate * percentX;
          const translateY = maxTranslate * percentY;
          
          tiltContainer.style.transform = 
            `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
        };

        const handleMouseEnter = () => {
          isHovering = true;
          tiltContainer.style.transition = 'none';
        };

        const handleMouseLeave = () => {
          isHovering = false;
          tiltContainer.style.transition = 'transform 0.3s ease-out';
          tiltContainer.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg) translateZ(0)';
        };

        tiltContainer.addEventListener('mouseenter', handleMouseEnter);
        tiltContainer.addEventListener('mousemove', (e) => {
          if (requestFrame) cancelAnimationFrame(requestFrame);
          requestFrame = requestAnimationFrame(() => handleMouseMove(e));
        });
        tiltContainer.addEventListener('mouseleave', handleMouseLeave);
      }

      // ===== PARALLAX FOR BACKGROUND SHAPES =====
      const shapes = document.querySelectorAll('.shape');
      if (shapes.length) {
        document.addEventListener('mousemove', (e) => {
          const mouseX = e.clientX / window.innerWidth - 0.5;
          const mouseY = e.clientY / window.innerHeight - 0.5;
          
          shapes.forEach((shape, index) => {
            const speed = 0.02 + (index * 0.01);
            const moveX = mouseX * 30 * speed;
            const moveY = mouseY * 20 * speed;
            shape.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
          });
        });
      }

      // ===== FLOATING MEDICAL PARTICLES (tiny pills / crosses) =====
      const medicalBg = document.querySelector('.medical-shapes');
      for (let i = 0; i < 16; i++) {
        const particle = document.createElement('div');
        particle.classList.add('shape', 'medical-particle');
        const size = Math.random() * 8 + 3;
        // mix of circles (pills) and small plus-like shapes
        if (Math.random() > 0.5) {
          // pill shape (rounded)
          particle.style.cssText = `
            position: absolute;
            width: ${size * 1.5}px;
            height: ${size * 0.6}px;
            background: rgba(111, 207, 151, 0.6);
            border-radius: 20px;
            top: ${Math.random() * 100}%;
            left: ${Math.random() * 100}%;
            filter: blur(${Math.random() * 4}px);
            opacity: ${0.2 + Math.random() * 0.4};
            animation: floatShape ${12 + Math.random() * 20}s infinite alternate ease-in-out;
            box-shadow: 0 0 15px #6fcf97;
            pointer-events: none;
            z-index: 0;
          `;
        } else {
          // tiny plus (simulated with two rectangles)
          particle.style.cssText = `
            position: absolute;
            width: ${size}px;
            height: ${size}px;
            top: ${Math.random() * 100}%;
            left: ${Math.random() * 100}%;
            filter: blur(1.5px);
            opacity: ${0.15 + Math.random() * 0.3};
            animation: floatShape ${18 + Math.random() * 20}s infinite alternate ease-in-out;
            background: transparent;
            pointer-events: none;
            z-index: 0;
          `;
          // we'll create a plus using pseudo-element? too complex, just keep as blurred dot
          particle.style.background = `radial-gradient(circle at center, rgba(42,169,255,0.7) 0%, transparent 70%)`;
          particle.style.borderRadius = '0';
        }
        if (medicalBg) medicalBg.appendChild(particle);
      }
    })();
  </script>

  <!-- small style for injected particles -->
  <style>
    .medical-particle {
      mix-blend-mode: screen;
    }
    .cosmic-shapes * {
      pointer-events: none;
    }
    .card-3d-wrapper {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" fill="none" stroke="%232aa9ff" stroke-width="2" /><path d="M14 4 L14 8 M14 20 L14 24 M4 14 L8 14 M20 14 L24 14" stroke="%236fcf97" stroke-width="2" /></svg>') 14 14, auto;
    }
  </style>
</body>
</html>
